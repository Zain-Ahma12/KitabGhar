<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">KitabGhar Exchange APIs</title>
  <desc id="d">A bookshelf with one book pulled out, next to the project name and the tools it is built with.</desc>
  <style>
    .title { font: 700 76px Georgia, 'Times New Roman', serif; fill: #FFFFFF; letter-spacing: -1px; }
    .sub   { font: 400 30px Georgia, 'Times New Roman', serif; fill: #F4B33D; }
    .tag   { font: 400 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B9C2F2; }
    .chip  { fill: none; stroke: #5360A8; stroke-width: 1.5; }
    .chipt { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #EEF1FF; text-anchor: middle; }
    .band  { fill: #FFFFFF; opacity: .35; }
    .tab   { fill: #FFFFFF; opacity: .25; }

    /* The borrowed book rests in its pulled-out pose; on load it slides out of the shelf once. */
    .pull {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: translate(8px, -30px) rotate(9deg);
      animation: pull 1.4s cubic-bezier(.2, .8, .2, 1) .6s backwards;
    }
    @keyframes pull { from { transform: none; } }
    @media (prefers-reduced-motion: reduce) { .pull { animation: none; } }
  </style>

  <rect width="1200" height="300" rx="16" fill="#1B2250"/>

  <!-- Text block -->
  <text class="title" x="58" y="120">KitabGhar</text>
  <text class="sub" x="60" y="162">Exchange APIs</text>
  <text class="tag" x="60" y="198">A book rental system, modelled on the real world.</text>

  <g>
    <rect class="chip" x="60"  y="222" width="92"  height="30" rx="15"/><text class="chipt" x="106" y="242">FastAPI</text>
    <rect class="chip" x="164" y="222" width="106" height="30" rx="15"/><text class="chipt" x="217" y="242">SQLModel</text>
    <rect class="chip" x="282" y="222" width="84"  height="30" rx="15"/><text class="chipt" x="324" y="242">SQLite</text>
    <rect class="chip" x="378" y="222" width="92"  height="30" rx="15"/><text class="chipt" x="424" y="242">Uvicorn</text>
    <rect class="chip" x="482" y="222" width="54"  height="30" rx="15"/><text class="chipt" x="509" y="242">uv</text>
  </g>

  <!-- Shelf -->
  <rect x="640" y="274" width="520" height="4" fill="#141940" opacity=".6"/>
  <rect x="640" y="262" width="520" height="12" rx="3" fill="#39438A"/>

  <!-- Empty slot left by the borrowed book -->
  <rect x="902" y="84" width="62" height="178" fill="#141940"/>

  <!-- Books on the shelf (bottom edge at y=262) -->
  <g>
    <rect x="660" y="112" width="46" height="150" rx="3" fill="#EF6F57"/>
    <rect class="band" x="660" y="130" width="46" height="5"/><rect class="band" x="660" y="232" width="46" height="5"/>
    <rect class="tab" x="668" y="150" width="30" height="36" rx="2"/>

    <rect x="708" y="82" width="38" height="180" rx="3" fill="#F4B33D"/>
    <rect class="band" x="708" y="100" width="38" height="5"/><rect class="band" x="708" y="242" width="38" height="5"/>
    <rect class="tab" x="715" y="120" width="24" height="44" rx="2"/>

    <rect x="748" y="132" width="52" height="130" rx="3" fill="#2EC4B6"/>
    <rect class="band" x="748" y="150" width="52" height="5"/><rect class="band" x="748" y="242" width="52" height="5"/>
    <rect class="tab" x="757" y="168" width="34" height="30" rx="2"/>

    <rect x="802" y="97" width="40" height="165" rx="3" fill="#7FA6F5"/>
    <rect class="band" x="802" y="115" width="40" height="5"/><rect class="band" x="802" y="242" width="40" height="5"/>
    <rect class="tab" x="809" y="135" width="26" height="40" rx="2"/>

    <rect x="844" y="72" width="56" height="190" rx="3" fill="#9B6FD1"/>
    <rect class="band" x="844" y="90" width="56" height="5"/><rect class="band" x="844" y="242" width="56" height="5"/>
    <rect class="tab" x="853" y="112" width="38" height="50" rx="2"/>

    <rect x="966" y="107" width="44" height="155" rx="3" fill="#F4B33D"/>
    <rect class="band" x="966" y="125" width="44" height="5"/><rect class="band" x="966" y="242" width="44" height="5"/>
    <rect class="tab" x="973" y="145" width="30" height="36" rx="2"/>

    <rect x="1012" y="122" width="50" height="140" rx="3" fill="#EF6F57"/>
    <rect class="band" x="1012" y="140" width="50" height="5"/><rect class="band" x="1012" y="242" width="50" height="5"/>
    <rect class="tab" x="1020" y="158" width="34" height="32" rx="2"/>

    <rect x="1064" y="87" width="40" height="175" rx="3" fill="#7FA6F5"/>
    <rect class="band" x="1064" y="105" width="40" height="5"/><rect class="band" x="1064" y="242" width="40" height="5"/>
    <rect class="tab" x="1071" y="125" width="26" height="42" rx="2"/>

    <rect x="1106" y="142" width="36" height="120" rx="3" fill="#9B6FD1"/>
    <rect class="band" x="1106" y="160" width="36" height="5"/><rect class="band" x="1106" y="242" width="36" height="5"/>
  </g>

  <!-- The borrowed book -->
  <g class="pull">
    <rect x="910" y="90" width="46" height="172" rx="3" fill="#F3EFE6"/>
    <rect x="910" y="108" width="46" height="8" fill="#EF6F57"/>
    <rect x="910" y="238" width="46" height="8" fill="#EF6F57"/>
    <rect x="918" y="134" width="30" height="40" rx="2" fill="#1B2250" opacity=".14"/>
  </g>
</svg>
