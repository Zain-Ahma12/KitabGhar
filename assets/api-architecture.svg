<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">KitabGhar request flow</title>
  <desc id="d">A client sends HTTP requests to a Uvicorn server running FastAPI. FastAPI routes them to the book, user and health endpoints. The book and user endpoints read and write a SQLite database.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9AA6E8"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .flow { fill: none; stroke: #9AA6E8; stroke-width: 2; }
    .dash { stroke-dasharray: 7 7; animation: march 1.2s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { .dash { animation: none; } }
  </style>
  <rect width="1100" height="700" rx="16" fill="#1B2250"/>

<rect x="30" y="275" width="160" height="110" rx="12" fill="#262F6B" stroke="#4A5694" stroke-width="1.5"/>
