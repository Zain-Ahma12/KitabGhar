<text class="sans" x="110" y="350" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">Client</text>
<text class="sans" x="110" y="372" font-size="15" text-anchor="middle" fill="#B9C2F2">Browser or curl</text>
<path class="flow dash" d="M190 330 H246" marker-end="url(#arr)"/>
<text class="mono" x="218" y="316" font-size="14" text-anchor="middle" fill="#EEF1FF">HTTP</text>
<text class="mono" x="218" y="354" font-size="14" text-anchor="middle" fill="#B9C2F2">JSON</text>
