<text class="sans" x="355" y="212" font-size="15" text-anchor="middle" fill="#B9C2F2">ASGI server, port 8000</text>
<rect x="268" y="232" width="174" height="170" rx="10" fill="#1B2250" stroke="#4A5694"/>
<text class="sans" x="355" y="262" font-size="19" font-weight="700" text-anchor="middle" fill="#F4B33D">FastAPI app</text>
<text class="sans" x="355" y="292" font-size="15" text-anchor="middle" fill="#EEF1FF">Validates requests</text>
<text class="sans" x="355" y="318" font-size="15" text-anchor="middle" fill="#EEF1FF">Checks x-api-key</text>
<text class="sans" x="355" y="344" font-size="15" text-anchor="middle" fill="#EEF1FF">Creates tables on start</text>
<text class="sans" x="355" y="370" font-size="15" text-anchor="middle" fill="#EEF1FF">Swagger UI at /docs</text>
<line x1="268" y1="424" x2="442" y2="424" stroke="#4A5694"/>
