<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Rocket" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Rocket</title>
  <style>
.fl{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-1.5px)}}
.fire{transform-origin:24px 34px;animation:flick .45s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3)}}
.st{animation:tw 2.4s ease-in-out infinite}.s2{animation-delay:.8s}.s3{animation-delay:1.6s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  
