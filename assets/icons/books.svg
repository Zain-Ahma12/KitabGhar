  <rect width="48" height="48" rx="12" fill="#1B2250"/>
  
  <rect x="9" y="31" width="30" height="8" rx="2" fill="#7FA6F5"/><rect x="9" y="34" width="30" height="1.6" fill="#F3EFE6" opacity=".45"/>
  <rect x="12" y="22" width="26" height="8" rx="2" fill="#F4B33D"/><rect x="12" y="25" width="26" height="1.6" fill="#F3EFE6" opacity=".45"/>
  <g class="tp">
    <rect x="8" y="13" width="28" height="8" rx="2" fill="#EF6F57"/><rect x="8" y="16" width="28" height="1.6" fill="#F3EFE6" opacity=".45"/>
  </g>

</svg>
