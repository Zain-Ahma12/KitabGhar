<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Stack of books" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Stack of books</title>
  <style>
.tp{animation:slide 3.6s ease-in-out infinite}
@keyframes slide{0%,35%,100%{transform:translateX(0)}55%,75%{transform:translateX(7px)}}
